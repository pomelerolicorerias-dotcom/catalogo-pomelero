<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomelero Licorerías - Catálogo de Mayoreo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap'); body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- HEADER -->
    <nav class="p-4 border-b border-amber-500/30 flex justify-between items-center bg-slate-900 sticky top-0 z-50">
        <h1 class="text-xl font-bold text-amber-400 cursor-pointer" onclick="showView('catalogo')">POMELERO</h1>
        <div class="flex gap-2 text-sm">
            <button onclick="showView('catalogo')" class="px-3 py-1">Catálogo</button>
            <button onclick="openCart()" class="px-3 py-1 bg-amber-500/10 text-amber-400 rounded-lg font-bold">Carrito (<span id="cartCount">0</span>)</button>
            <button onclick="showView('auth')" class="px-3 py-1 bg-slate-800 rounded-lg">Ingresar</button>
            <button onclick="showView('admin')" class="px-3 py-1 bg-slate-800 rounded-lg">Administrar</button>
        </div>
    </nav>

    <main class="p-6 max-w-6xl mx-auto">
        <!-- VISTA CATÁLOGO -->
        <div id="view-catalogo">
            <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Buscar producto..." class="w-full bg-slate-900 p-3 rounded-xl mb-6 border border-slate-800">
            <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </div>

        <!-- VISTA INGRESO -->
        <div id="view-auth" class="hidden max-w-md mx-auto bg-slate-900 p-8 rounded-2xl">
            <h2 class="text-xl font-bold mb-4">Iniciar Sesión</h2>
            <input type="text" id="loginUser" placeholder="Teléfono" class="w-full bg-slate-950 p-3 rounded mb-3 border border-slate-800">
            <input type="password" id="loginPass" placeholder="Contraseña" class="w-full bg-slate-950 p-3 rounded mb-4 border border-slate-800">
            <button onclick="loginUser()" class="w-full bg-amber-500 text-black font-bold py-3 rounded-lg">Entrar</button>
            <div class="text-xs text-center mt-4 space-y-2">
                <a href="https://wa.me/523781211112?text=Solicito borrar cuenta" target="_blank" class="block underline">Borrar cuenta</a>
                <a href="https://wa.me/523781211112?text=Olvide contraseña" target="_blank" class="block underline">Recuperar contraseña</a>
            </div>
        </div>

        <!-- VISTA ADMIN -->
        <div id="view-admin" class="hidden">
            <div id="adminLogin" class="max-w-sm mx-auto bg-slate-900 p-6 rounded-xl">
                <input type="password" id="adminPass" placeholder="Clave Admin" class="w-full bg-slate-950 p-2 mb-2 rounded border border-slate-700">
                <button onclick="checkAdmin()" class="w-full bg-amber-500 text-black font-bold py-2 rounded">Entrar</button>
            </div>
            <div id="adminPanel" class="hidden space-y-4">
                <div class="flex gap-2 border-b border-slate-800 pb-2">
                    <button onclick="renderUsers()">Usuarios</button>
                    <button onclick="renderOrders()">Pedidos</button>
                </div>
                <div id="adminList" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <!-- CARRITO MODAL -->
    <div id="cartModal" class="fixed inset-0 bg-slate-950/90 hidden flex justify-end">
        <div class="bg-slate-900 w-full max-w-sm p-6 overflow-y-auto">
            <h3 class="font-bold mb-4">Mi Pedido</h3>
            <div id="cartItems" class="space-y-2"></div>
            <button onclick="submitOrder()" class="w-full bg-amber-500 text-black font-bold py-3 mt-6 rounded-lg">Enviar Pedido WhatsApp</button>
            <button onclick="closeCart()" class="w-full mt-2 text-slate-400">Cerrar</button>
        </div>
    </div>

    <script>
        // Lógica Global
        let cart = [];
        let products = JSON.parse(localStorage.getItem('pomelero_products') || '[]');

        function showView(view) {
            ['catalogo', 'auth', 'admin'].forEach(v => document.getElementById('view-' + v).classList.add('hidden'));
            document.getElementById('view-' + view).classList.remove('hidden');
        }

        // Carrito
        function addToCart(p) {
            cart.push(p);
            document.getElementById('cartCount').textContent = cart.length;
            alert(p.name + " agregado");
        }
        function openCart() { document.getElementById('cartModal').classList.remove('hidden'); renderCart(); }
        function closeCart() { document.getElementById('cartModal').classList.add('hidden'); }
        function renderCart() {
            document.getElementById('cartItems').innerHTML = cart.map((i, idx) => `<div class="flex justify-between">${i.name} <b>$${i.price}</b></div>`).join('');
        }

        // Admin
        function checkAdmin() {
            if(document.getElementById('adminPass').value === "pomelero2026") {
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            }
        }
        function renderUsers() {
            const users = JSON.parse(localStorage.getItem('pomelero_registered_clients') || '[]');
            document.getElementById('adminList').innerHTML = users.map(u => `
                <div class="bg-slate-900 p-3 rounded flex justify-between">
                    <span>${u.name} - ${u.phone}</span>
                    <button onclick="deleteUser('${u.phone}')" class="text-red-400">Eliminar</button>
                </div>
            `).join('');
        }
        function deleteUser(phone) {
            let u = JSON.parse(localStorage.getItem('pomelero_registered_clients') || '[]');
            localStorage.setItem('pomelero_registered_clients', JSON.stringify(u.filter(x => x.phone !== phone)));
            renderUsers();
        }

        // Render Catálogo
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(p => `
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <h4 class="font-bold text-sm truncate">${p.name}</h4>
                    <p class="text-amber-400 font-bold">$${p.price}</p>
                    <button onclick='addToCart(${JSON.stringify(p)})' class="w-full mt-2 bg-slate-700 text-xs py-1 rounded">Agregar</button>
                </div>
            `).join('');
        }

        renderProducts();
    </script>
</body>
</html>
