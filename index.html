                    snapshot.forEach(doc => {
                        loadedOrders.push({ id: doc.id, ...doc.data() });

                    loadedOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    setOrders(loadedOrders);

                return () => unsubscribe();

            const updateOrderStatus = async (id, status) => {
                if (!db) return;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', id), { status });

            };

            const deleteOrder = async (id) => {
                if (!db) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', id));
                } catch (e) { console.error(e); }
            };

            const processFile = (file) => {
                if (!file) return;
                
                if (!file.name.match(/\.(xlsx|xls)$/i)) {
                    alert("Por favor, sube únicamente un archivo Excel (.xlsx o .xls)");
                    return;
                }

                setFileName(file.name);

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        if (!window.XLSX) {
                            alert("La herramienta de lectura de Excel no se ha cargado. Verifica tu conexión a internet y recarga la página.");
                            return;
                        }

                        const data = new Uint8Array(evt.target.result);
                        const wb = window.XLSX.read(data, { type: 'array' });
                        const wsname = wb.SheetNames[0]; 
                        const ws = wb.Sheets[wsname];
                        const rawData = window.XLSX.utils.sheet_to_json(ws, { defval: "" });
                        
                        const normalized = rawData.map(row => {
                            const lowerRow = {};
                            for(let k in row) {
                                if(row[k] !== undefined && row[k] !== null) {
                                    const cleanKey = k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                                    lowerRow[cleanKey] = row[k];
                                }
                            }

                            const getVal = (possibleNames) => {
                                const key = Object.keys(lowerRow).find(k => possibleNames.some(p => k.includes(p)));
                                return key ? lowerRow[key] : '';
                            };
                            
                            let priceRaw = getVal(['precio', 'costo', 'mayoreo', 'importe', 'price']);
                            let price = 0;
                            if (typeof priceRaw === 'number') {
                                price = priceRaw;
                            } else if (typeof priceRaw === 'string') {
                                price = parseFloat(priceRaw.replace(/[^0-9.-]+/g,""));
                            }
                            
                            const rawName = getVal(['nombre', 'producto', 'articulo', 'descrip', 'name']);
                            const nameStr = rawName ? String(rawName).trim() : '';
                            
                            return {
                                name: nameStr,
                                price: isNaN(price) ? 0 : price,
                                category: String(getVal(['categoria', 'familia', 'tipo', 'departamento', 'category']) || 'General'),
                                volume: String(getVal(['capacidad', 'volumen', 'ml', 'litro', 'presentacion', 'tamaño']) || ''),
                                imageUrl: String(getVal(['imagen', 'foto', 'url', 'image', 'link']) || '')
                            };
                        }).filter(item => item.name && item.name !== '' && item.name !== 'undefined');

                        if (normalized.length === 0) {
                            alert("El archivo se leyó, pero no se encontraron productos. Verifica que las columnas se llamen: Nombre, Precio, Categoria, etc.");
                        }

                        setFileData(normalized);
                    } catch (error) {
                        console.error("Error al procesar Excel:", error);
                        alert("Hubo un error interno al leer el archivo. Asegúrate de que no esté dañado o protegido con contraseña.");
                    }
                };
                
                reader.onerror = () => {
                    alert("Error al intentar leer el archivo desde tu computadora.");
                }

                reader.readAsArrayBuffer(file);
                
                if(fileInputRef.current) fileInputRef.current.value = null; 
            };

                e.preventDefault();
                setIsDragging(true);
            };

                e.preventDefault();
                setIsDragging(false);
            };

                setIsDragging(false);

                                onDragOver={handleDragOver}
                                onDragLeave={handleDragLeave}
                                onDrop={handleDrop}

                                <input type="file" accept=".xlsx, .xls" className="hidden" ref={fileInputRef} onChange={(e) => processFile(e.target.files[0])} />

                                                    {order.items.map((item, idx) => (
                                                        <div key={idx} className="flex justify-between items-center py-1">
                                                            <span className="text-gray-600"><span className="font-bold text-pomelero-gold">{item.qty}x</span> {item.name} <span className="text-xs text-gray-400">({item.volume})</span></span>
                                                            <span className="font-medium text-gray-800">${(item.price * item.qty).toFixed(2)}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                                {order.customer.notes && (
                                                    <div className="mt-3 bg-yellow-50 p-3 rounded-md text-yellow-800 border border-yellow-100">
                                                        <span className="font-bold block text-xs uppercase mb-1">Notas del cliente:</span>
                                                        {order.customer.notes}
                                                    </div>
                                                )}

                                                <div className="mt-4 flex justify-end gap-2 border-t border-gray-200 pt-4">
                                                    {orderTab === 'nuevo' ? (
                                                        <button 
                                                            onClick={() => updateOrderStatus(order.id, 'archivado')}
                                                            className="text-sm px-4 py-2 bg-emerald-100 text-emerald-700 font-bold rounded-lg hover:bg-emerald-200 transition-colors"
                                                        >
                                                            Marcar como Atendido (Archivar)
                                                        </button>
                                                    ) : (
                                                        <>
                                                            <button 
                                                                onClick={() => updateOrderStatus(order.id, 'nuevo')}
                                                                className="text-sm px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded-lg hover:bg-gray-300 transition-colors"
                                                            >
                                                                Restaurar
                                                            </button>
                                                            <button 
                                                                onClick={() => deleteOrder(order.id)}
                                                                className="text-sm px-4 py-2 bg-red-100 text-red-700 font-bold rounded-lg hover:bg-red-200 transition-colors"
                                                            >
                                                                Eliminar Definitivamente
                                                            </button>
                                                        </>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const CatalogView = ({ products, cart, updateCart }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('Todos');

            const categories = useMemo(() => {
                const cats = new Set(products.map(p => p.category.trim()));
                return ['Todos', ...Array.from(cats).filter(c => c).sort()];
            }, [products]);

            const filteredProducts = useMemo(() => {
                return products.filter(p => {
                    const matchSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchCategory = selectedCategory === 'Todos' || p.category.trim() === selectedCategory;
                    return matchSearch && matchCategory;
                });
            }, [products, searchTerm, selectedCategory]);

            return (
                <div className="max-w-7xl mx-auto px-4 py-8 pb-24">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
                        <div className="w-full md:w-1/2 relative">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <SearchIcon />
                            </div>
                            <input 
                                type="text" 
                                placeholder="Buscar licores, marcas, presentaciones..." 
                                className="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pomelero-gold focus:border-transparent shadow-sm"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                        </div>
                        
                        <div className="w-full md:w-auto flex overflow-x-auto hide-scrollbar gap-2 pb-2">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setSelectedCategory(cat)}
                                    className={`whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-colors ${selectedCategory === cat ? 'bg-pomelero-gold text-white shadow-md' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>

                    {filteredProducts.length === 0 ? (
                        <div className="text-center py-20">
                            <p className="text-2xl text-gray-400 font-serif">No se encontraron productos.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
                            {filteredProducts.map((product, idx) => (
                                <div key={idx} className="bg-white rounded-xl shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 flex flex-col group overflow-hidden">
                                    <ProductImagePlaceholder category={product.category} name={product.name} imageUrl={product.imageUrl} />
                                    <div className="p-4 flex flex-col flex-grow">
                                        <span className="text-[10px] md:text-xs font-bold text-pomelero-gold uppercase tracking-wider mb-1">{product.category}</span>
                                        <h3 className="text-sm md:text-base font-bold text-gray-800 leading-tight flex-grow">{product.name}</h3>
                                        <div className="mt-3 flex flex-col gap-3">
                                            <p className="text-[10px] text-gray-400 leading-none">{product.volume}</p>
                                            <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-2">
                                                <p className="text-lg md:text-xl font-black text-pomelero-bg">${Number(product.price).toFixed(2)}</p>
                                                
                                                <div className="flex items-center w-full md:w-auto bg-gray-50 border border-gray-200 rounded-lg overflow-hidden shrink-0">
                                                    {(!cart[`${product.name}-${product.volume}`] || cart[`${product.name}-${product.volume}`] === 0) ? (
                                                        <button 
                                                            onClick={() => updateCart(`${product.name}-${product.volume}`, 1)} 
                                                            className="px-3 py-1.5 md:py-1 bg-white text-pomelero-bg border border-pomelero-gold font-bold text-sm w-full hover:bg-pomelero-gold hover:text-white transition-colors"
                                                        >
                                                            Agregar
                                                        </button>
                                                    ) : (
                                                        <>
                                                            <button 
                                                                onClick={() => updateCart(`${product.name}-${product.volume}`, cart[`${product.name}-${product.volume}`] - 1)} 
                                                                className="px-3 md:px-2 py-1.5 md:py-1 text-pomelero-bg hover:bg-gray-200 font-black text-lg leading-none"
                                                            >-</button>
                                                            <span className="px-2 text-sm font-bold w-8 text-center text-pomelero-bg bg-white py-1.5 md:py-1 border-x border-gray-200">{cart[`${product.name}-${product.volume}`]}</span>
                                                            <button 
                                                                onClick={() => updateCart(`${product.name}-${product.volume}`, cart[`${product.name}-${product.volume}`] + 1)} 
                                                                className="px-3 md:px-2 py-1.5 md:py-1 text-pomelero-bg hover:bg-gray-200 font-black text-lg leading-none"
                                                            >+</button>
                                                        </>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('catalog');
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState({});
            const [showCartModal, setShowCartModal] = useState(false);
            const [loading, setLoading] = useState(true);
            const [modal, setModal] = useState({ show: false, title: '', message: '' });
            const [isSyncing, setIsSyncing] = useState(false);

            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [showAdminLogin, setShowLoginAdmin] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [checkoutSuccess, setCheckoutSuccess] = useState({ show: false, url: '' });

            const showModal = (title, message) => setModal({ show: true, title, message });

            const handleAdminClick = () => {
                if (isAdminAuthenticated) {
                    setView('admin');
                } else {
                    setShowLoginAdmin(true);
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassword === 'pomelero2026') {
                    setIsAdminAuthenticated(true);
                    setShowLoginAdmin(false);
                    setView('admin');
                    setAdminPassword('');
                } else {
                    showModal('Acceso denegado', 'La contraseña ingresada es incorrecta.');
                }
            };

            const updateCart = (productId, quantity) => {
                setCart(prev => {
                    const newCart = { ...prev };
                    if (quantity <= 0) {
                        delete newCart[productId];
                    } else {
                        newCart[productId] = quantity;
                    }
                    return newCart;
                });
            };

            const handleCheckout = async (customerData, cartItems, total) => {
                const businessPhone = "523781211112"; 

                let waMessage = `*NUEVO PEDIDO - POMELERO MAYOREO* 📦\n\n`;
                waMessage += `*Cliente:* ${customerData.name}\n`;
                waMessage += `*Teléfono:* ${customerData.phone}\n`;
                if (customerData.address) waMessage += `*Dirección:* ${customerData.address}\n`;
                if (customerData.notes) waMessage += `*Notas:* ${customerData.notes}\n\n`;
                waMessage += `*Artículos:*\n`;
                cartItems.forEach(item => {
                    waMessage += `▫️ ${item.qty}x ${item.name} (${item.volume}) - $${(item.price * item.qty).toFixed(2)}\n`;
                });
                waMessage += `\n*TOTAL:* $${total.toFixed(2)}\n\n`;
                waMessage += `Por favor confirmen mi pedido. ¡Gracias!`;

                const encodedMessage = encodeURIComponent(waMessage);
                const whatsappUrl = `https://wa.me/${businessPhone}?text=${encodedMessage}`;

                if (db) {
                    setIsSyncing(true);
                    try {
                        const orderData = {
                            customer: customerData,
                            items: cartItems,
                            total: total,
                            status: 'nuevo',
                            createdAt: new Date().toISOString()
                        };
                        const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
                        await addDoc(ordersRef, orderData);
                    } catch (error) {
                        console.error("No se guardó en BD, pero se enviará por WhatsApp: ", error);
                    } finally {
                        setIsSyncing(false);
                    }
                }

                setCart({});
                setShowCartModal(false);
                setCheckoutSuccess({ show: true, url: whatsappUrl });
            };

            useEffect(() => {
                if (!db) {
                    setProducts(initialMockData);
                    setLoading(false);
                    return;
                }

                let unsubscribe = () => {};

                const initializeAppAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }

                        const productsRef = collection(db, 'artifacts', appId, 'public', 'data', 'catalog_products');
                        
                        unsubscribe = onSnapshot(productsRef, (snapshot) => {
                            const loadedData = [];
                            snapshot.forEach(doc => {
                                loadedData.push({ id: doc.id, ...doc.data() });
                            });
                            
                            setProducts(loadedData.length > 0 ? loadedData : initialMockData);
                            setLoading(false);
                        }, (error) => {
                            console.error("Error al escuchar base de datos:", error);
                            setLoading(false);
                        });
                    } catch (error) {
                        console.error("Error de autenticación:", error);
                        setLoading(false);
                    }
                };

                initializeAppAuth();
                return () => unsubscribe();
            }, []);

            const syncToDatabase = async (newProductsData) => {
                if (!db) {
                    let updatedList = [...products];
                    let added = 0;
                    let updated = 0;
                    newProductsData.forEach(newItem => {
                        const existingIndex = updatedList.findIndex(p => p.name.toLowerCase().trim() === newItem.name.toLowerCase().trim());
                        if (existingIndex >= 0) {
                            updatedList[existingIndex] = { ...updatedList[existingIndex], ...newItem };
                            updated++;
                        } else {
                            updatedList.push(newItem);
                            added++;
                        }
                    });
                    setProducts(updatedList);
                    showModal("Actualización Local", `¡Listo! Se actualizaron ${updated} productos y se agregaron ${added} nuevos.`);
                    setView('catalog');
                    return;
                }

                setIsSyncing(true);
                try {
                    const productsRef = collection(db, 'artifacts', appId, 'public', 'data', 'catalog_products');
                    const snapshot = await getDocs(productsRef);
                    
                    const existingDocs = {};
                    snapshot.docs.forEach(document => {
                        const data = document.data();
                        if(data.name) {
                            const normName = data.name.toLowerCase().trim();
                            existingDocs[normName] = { ref: document.ref, data: data };
                        }
                    });

                    const batches = [];
                    let currentBatch = writeBatch(db);
                    let opCount = 0;
                    let addedCount = 0;
                    let updatedCount = 0;

                    newProductsData.forEach(item => {
                        const normName = item.name.toLowerCase().trim();
                        
                        if (existingDocs[normName]) {
                            currentBatch.update(existingDocs[normName].ref, { 
                                price: item.price,
                                category: item.category,
                                volume: item.volume,
                                imageUrl: item.imageUrl || existingDocs[normName].data.imageUrl || '',
                                updatedAt: new Date().toISOString() 
                            });
                            updatedCount++;
                        } else {
                            const newDocRef = doc(productsRef);
                            currentBatch.set(newDocRef, { ...item, updatedAt: new Date().toISOString() });
                            addedCount++;
                        }

                        opCount++;
                        if (opCount === 450) { 
                            batches.push(currentBatch);
                            currentBatch = writeBatch(db);
                            opCount = 0;
                        }
                    });

                    if (opCount > 0) {
                        batches.push(currentBatch);
                    }

                    for (let batch of batches) {
                        await batch.commit();
                    }

                    showModal("¡Éxito!", `Sincronización completa. Se actualizaron ${updatedCount} productos y se agregaron ${addedCount} nuevos.`);
                    setView('catalog');
                } catch (error) {
                    showModal("Error de sincronización", error.message);
                } finally {
                    setIsSyncing(false);
                }
            };

            const totalCartItems = Object.values(cart).reduce((sum, qty) => sum + qty, 0);

            return (
                <div className="min-h-screen flex flex-col relative">
                    <nav className="bg-pomelero-bg text-white shadow-md sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4">
                            <div className="flex justify-between items-center h-20">
                                {/* Integración del Logo Base64 */}
                                <div className="flex items-center gap-2">
                                    <img src={logoBase64} alt="Pomelero Logo" className="h-16 w-auto object-contain" />
                                </div>
                                
                                <div className="flex gap-2 bg-slate-800 p-1 rounded-lg">
                                    <button 
                                        onClick={() => setView('catalog')} 
                                        className={`px-4 py-2 text-sm font-semibold rounded-md transition-all ${view === 'catalog' ? 'bg-pomelero-gold text-white shadow-sm' : 'text-gray-300 hover:text-white'}`}
                                    >
                                        Catálogo
                                    </button>
                                    <button 
                                        onClick={handleAdminClick} 
                                        className={`px-4 py-2 text-sm font-semibold rounded-md transition-all ${view === 'admin' ? 'bg-pomelero-gold text-white shadow-sm' : 'text-gray-300 hover:text-white'}`}
                                    >
                                        Administrar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {loading && (
                        <div className="flex-grow flex flex-col items-center justify-center">
                            <div className="w-12 h-12 border-4 border-pomelero-gold border-t-transparent rounded-full animate-spin"></div>
                            <p className="mt-4 text-gray-500 font-medium">Cargando catálogo...</p>
                        </div>
                    )}

                    {isSyncing && (
                        <div className="fixed inset-0 bg-pomelero-bg/80 z-50 flex flex-col items-center justify-center text-white backdrop-blur-sm">
                            <div className="w-16 h-16 border-4 border-pomelero-gold border-t-transparent rounded-full animate-spin mb-6"></div>
                            <h2 className="text-2xl font-serif font-bold">Sincronizando Base de Datos...</h2>
                            <p className="mt-2 text-gray-300">Este proceso puede tardar unos segundos dependiendo del tamaño de tu Excel.</p>
                        </div>
                    )}

                    {!loading && view === 'catalog' && <CatalogView products={products} cart={cart} updateCart={updateCart} />}
                    {!loading && view === 'admin' && isAdminAuthenticated && <AdminView onSync={syncToDatabase} products={products} />}

                    {totalCartItems > 0 && view === 'catalog' && (
                        <button 
                            onClick={() => setShowCartModal(true)} 
                            className="fixed bottom-6 right-6 bg-pomelero-bg border-2 border-pomelero-gold text-white p-4 rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.3)] flex items-center gap-3 hover:scale-105 transition-transform z-40 group"
                        >
                            <CartIcon />
                            <div className="flex flex-col items-start leading-none">
                                <span className="font-bold text-sm">Ver Pedido</span>
                                <span className="text-[10px] text-pomelero-gold">{totalCartItems} artículos</span>
                            </div>
                        </button>
                    )}

                    {showCartModal && (
                        <CartModal 
                            cart={cart} 
                            products={products} 
                            onClose={() => setShowCartModal(false)} 
                            onCheckout={handleCheckout} 
                            updateCart={updateCart}
                        />
                    )}

                    {modal.show && <CustomModal title={modal.title} message={modal.message} onClose={() => setModal({show: false})} />}

                    {checkoutSuccess.show && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm transition-all">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8 text-center">
                                <div className="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <svg width="40" height="40" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                </div>
                                <h3 className="text-2xl font-bold text-gray-900 mb-2">¡Pedido Guardado!</h3>
                                <p className="text-gray-500 mb-6 text-sm">Para finalizar, envíanos el mensaje por WhatsApp haciendo clic en el botón de abajo.</p>
                                <a 
                                    href={checkoutSuccess.url} 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    onClick={() => setCheckoutSuccess({show: false, url: ''})}
                                    className="block w-full bg-[#25D366] text-white font-bold py-3.5 rounded-xl hover:bg-green-500 transition-colors mb-3 shadow-lg shadow-green-500/30"
                                >
                                    Enviar WhatsApp
                                </a>
                                <button type="button" onClick={() => setCheckoutSuccess({show: false, url: ''})} className="text-gray-400 text-sm font-semibold hover:text-gray-600">
                                    Cerrar
                                </button>
                            </div>
                        </div>
                    )}

                    {showAdminLogin && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 backdrop-blur-sm transition-all">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8 text-center">
                                <div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-500">
                                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                </div>
                                <h3 className="text-2xl font-bold text-gray-900 mb-2 font-serif">Área Privada</h3>
                                <p className="text-gray-500 mb-6 text-sm">Ingresa la contraseña maestra para administrar.</p>
                                <form onSubmit={handleAdminLogin}>
                                    <input 
                                        type="password" 
                                        value={adminPassword}
                                        onChange={(e) => setAdminPassword(e.target.value)}
                                        placeholder="Contraseña" 
                                        className="w-full px-4 py-3 border border-gray-200 rounded-xl mb-6 focus:outline-none focus:ring-2 focus:ring-pomelero-gold bg-gray-50 text-center text-lg tracking-widest"
                                    />
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => setShowLoginAdmin(false)} className="w-1/2 bg-gray-100 text-gray-700 font-semibold py-3 rounded-xl hover:bg-gray-200 transition-colors">
                                            Cancelar
                                        </button>
                                        <button type="submit" className="w-1/2 bg-pomelero-bg text-white font-semibold py-3 rounded-xl hover:bg-opacity-90 transition-colors">
                                            Ingresar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
