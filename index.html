<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomelero Licorerías</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Navegación -->
    <nav class="p-4 bg-slate-900 border-b border-amber-500/30 flex justify-between items-center">
        <h1 class="font-bold text-amber-400 text-xl">POMELERO</h1>
        <div class="flex gap-4">
            <button onclick="changeView('catalogo')" class="text-sm">Catálogo</button>
            <button onclick="changeView('admin')" class="text-sm bg-slate-800 px-3 py-1 rounded">Admin</button>
        </div>
    </nav>

    <main id="main" class="p-6">
        <!-- Vista Catalogo -->
        <div id="catalogo">
            <h2 class="text-2xl font-bold mb-4">Productos</h2>
            <div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </div>

        <!-- Vista Admin -->
        <div id="admin" class="hidden max-w-sm mx-auto bg-slate-900 p-6 rounded-xl">
            <h2 class="font-bold mb-4">Panel de Control</h2>
            <input type="password" id="pass" placeholder="Clave" class="w-full bg-slate-950 p-2 rounded mb-2">
            <button onclick="checkPass()" class="w-full bg-amber-500 text-black font-bold py-2 rounded">Entrar</button>
        </div>
    </main>

    <script>
        function changeView(v) {
            document.getElementById('catalogo').classList.toggle('hidden', v !== 'catalogo');
            document.getElementById('admin').classList.toggle('hidden', v !== 'admin');
        }

        function checkPass() {
            if(document.getElementById('pass').value === "pomelero2026") {
                alert("Acceso concedido");
            } else {
                alert("Clave incorrecta");
            }
        }

        // Carga productos iniciales
        const products = [
            { name: "Azteca de Oro 750ml", price: 175 },
            { name: "Don Julio 70 750ml", price: 720 }
        ];
        
        document.getElementById('grid').innerHTML = products.map(p => `
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                <h4 class="font-bold">${p.name}</h4>
                <p class="text-amber-400">$${p.price}</p>
            </div>
        `).join('');
    </script>
</body>
</html>
