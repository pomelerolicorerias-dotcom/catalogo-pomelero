<script>
    // ... (Mantén todo el código anterior hasta el script) ...
    
    // Nueva lógica de Auth con Password
    function processAuthStep1() {
        const val = document.getElementById('authIdentifier').value.trim();
        if(!val) { alert("Ingresa tu teléfono o usuario."); return; }

        let regClients = JSON.parse(localStorage.getItem('pomelero_registered_clients') || '[]');
        const found = regClients.find(c => c.phone === val || c.name.toLowerCase().includes(val.toLowerCase()));

        if(found) {
            // Pedir Contraseña
            const pass = prompt(`Hola ${found.name}, ingresa tu contraseña para acceder a tus datos:`);
            if(pass === found.password) {
                localStorage.setItem('pomelero_client_profile', JSON.stringify(found));
                loadClientProfileToUI();
                closeClientAuthModal();
                alert("¡Bienvenido! Sesión iniciada.");
            } else {
                alert("Contraseña incorrecta.");
            }
        } else {
            alert("Cuenta no encontrada. Por favor, regístrese.");
            switchAuthMode('register');
            document.getElementById('regPhone').value = val;
        }
    }

    function registerNewClient() {
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const address = document.getElementById('regAddress').value.trim();
        const password = document.getElementById('regPassword').value.trim(); // Nueva contraseña

        if(!name || !phone || !address || !password) { alert("Completa todos los campos obligatorios (*)."); return; }

        const profile = { name, phone, address, password, registeredDate: new Date().toLocaleString() };
        
        let regClients = JSON.parse(localStorage.getItem('pomelero_registered_clients') || '[]');
        const idx = regClients.findIndex(c => c.phone === phone);
        if(idx >= 0) regClients[idx] = profile; else regClients.push(profile);
        localStorage.setItem('pomelero_registered_clients', JSON.stringify(regClients));
        localStorage.setItem('pomelero_client_profile', JSON.stringify(profile));

        loadClientProfileToUI();
        closeClientAuthModal();
        alert("¡Cuenta creada con éxito!");
    }
</script>
